    <!-- JAVASCRIPT INTERACTIONS -->
    <script>
        // Web3 Wallet Connection Logic
        async function connectWallet() {
            const btnText = document.getElementById('btnText');
            if (typeof window.ethereum !== 'undefined') {
                try {
                    btnText.innerText = "Connexion...";
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    const shortAddr = account.substring(0, 6) + '...' + account.substring(account.length - 4);
                    
                    btnText.innerText = shortAddr;
                    document.getElementById('connectWalletBtn').classList.add('bg-emerald-600');
                    closeActionModal();
                } catch (err) {
                    console.error(err);
                    btnText.innerText = "Erreur de connexion";
                }
            } else {
                alert("Extension MetaMask introuvable ! Veuillez l'installer sur votre navigateur.");
                btnText.innerText = "Installer MetaMask";
            }
        }

        // Action Modal Control
        function openActionModal(actionName) {
            document.getElementById('modalTitle').innerText = actionName;
            document.getElementById('modalDesc').innerText = `Procéder à l'opération [${actionName}] directement depuis l'application Web3 MetaMask.`;
            document.getElementById('actionModal').classList.remove('hidden');
        }

        function closeActionModal() {
            document.getElementById('actionModal').classList.add('hidden');
        }

        // Swap Logic Simulation
        function calculateSwap() {
            const payVal = parseFloat(document.getElementById('payAmount').value) || 0;
            const ethPriceUSDT = 2600;
            document.getElementById('receiveAmount').value = (payVal * ethPriceUSDT).toFixed(2);
        }

        function reverseSwap() {
            const payInput = document.getElementById('payAmount');
            payInput.value = payInput.value == "0.5" ? "1.0" : "0.5";
            calculateSwap();
        }

        function executeSwap() {
            alert("Ordre de Swap exécuté avec succès sur le réseau principal !");
        }

        // Mobile Menu Toggle
        function toggleMobileMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
            menu.classList.toggle('flex');
        }

        // Chart.js Chart Initialization
        window.onload = function() {
            const ctx = document.getElementById('marketChart').getContext('2d');
            
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(246, 133, 27, 0.4)');
            gradient.addColorStop(1, 'rgba(246, 133, 27, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
                    datasets: [{
                        label: 'BTC / USDT',
                        data: [85000, 85400, 84800, 86200, 87100, 86800, 88500],
                        borderColor: '#F6851B',
                        borderWidth: 3,
                        fill: true,
                        backgroundColor: gradient,
                        tension: 0.4,
                        pointBackgroundColor: '#F6851B',
                        pointRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { display: false }
                        },
                        y: {
                            grid: { color: '#E5E7EB' }
                        }
                    }
                }
            });
        };
    </script>
