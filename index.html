<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendAI Crypto | Next-Gen Web3 Platform</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Web3 & WalletConnect Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3modal@1.9.12/dist/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js"></script>

    <style>
        :root {
            --bg: #050505;
            --surface: #0e0d0a;
            --surface-card: #14120e;
            --border: rgba(247, 189, 53, 0.15);
            --border-hover: rgba(247, 189, 53, 0.4);
            --gold: #f7bd35;
            --gold-glow: rgba(247, 189, 53, 0.25);
            --text-main: #f8f7f3;
            --text-muted: #a39e93;
            --green: #22c55e;
            --red: #ef4444;
            --radius-lg: 20px;
            --radius-md: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        .top-banner {
            background: linear-gradient(90deg, rgba(247, 189, 53, 0.15), rgba(247, 189, 53, 0.3), rgba(247, 189, 53, 0.15));
            border-bottom: 1px solid var(--border);
            color: var(--gold);
            text-align: center;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(247, 189, 53, 0.12), transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            pointer-events: none;
            z-index: -1;
        }

        .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

        header { position: sticky; top: 16px; z-index: 100; margin-bottom: 40px; margin-top: 12px; }

        .nav-inner {
            background: rgba(14, 13, 10, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 99px;
            padding: 12px 24px;
            display: flex; justify-content: space-between; align-items: center; gap: 12px;
        }

        .brand span {
            background: linear-gradient(135deg, #fff, var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800; font-size: 20px;
        }

        .btn {
            background: var(--surface-card);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 20px;
            border-radius: 99px;
            font-size: 14px; font-weight: 600; cursor: pointer;
            transition: var(--transition);
            display: inline-flex; align-items: center; gap: 8px;
        }

        .btn:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 20px var(--gold-glow); }
        .btn-primary { background: linear-gradient(135deg, #ffe18a, #d99a13); color: #070707; border: none; }

        .falling-container { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
        .fall-word {
            opacity: 0; transform: translateY(-50px);
            animation: fallIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            animation-delay: calc(var(--i) * 0.15s);
            font-size: 42px; font-weight: 800;
            background: linear-gradient(180deg, #ffffff 30%, #a39e93 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        @keyframes fallIn { 100% { opacity: 1; transform: translateY(0); } }

        .hero { text-align: center; padding: 40px 0; }
        .card { background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 24px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin: 40px 0; }
    </style>
</head>
<body>

    <div class="top-banner">✨ REAL WEB3 WALLET INTEGRATION CONNECT & TRADE ⚡</div>
    <div class="bg-grid"></div>

    <header class="wrap">
        <div class="nav-inner">
            <div class="brand">✨ <span>TrendAI Crypto</span></div>
            <div>
                <button id="connectWalletBtn" class="btn btn-primary" onclick="connectAllWallets()">
                    🔗 <span id="walletText">ربط جميع المحافظ (Connect Wallet)</span>
                </button>
            </div>
        </div>
    </header>

    <main class="wrap">
        <section class="hero">
            <h1 class="falling-container">
                <span class="fall-word" style="--i:1;">منصة</span>
                <span class="fall-word" style="--i:2;">التداول</span>
                <span class="fall-word" style="--i:3;">الحقيقي</span>
            </h1>
            <p style="color: var(--text-muted);">اربط محفظتك الرقمية الآن للوصول إلى الرصيد الحقيقي والشراء المباشر.</p>
        </section>

        <section class="grid">
            <div class="card">
                <h3 style="color: var(--gold); margin-bottom: 12px;">💳 حالة المحفظة المتصلة</h3>
                <p style="font-size: 14px; color: var(--text-muted);" id="walletStatus">لم يتم ربط أي محفظة بعد.</p>
                <br>
                <button class="btn" style="width:100%; justify-content:center;" onclick="sendTransaction()">🚀 إرسال معاملة تجريبية / شراء</button>
            </div>
        </section>
    </main>

    <script>
        let web3Modal;
        let provider;
        let signer;

        // Initialize Web3Modal with multi-wallet providers
        function initWeb3() {
            const providerOptions = {
                walletconnect: {
                    package: window.WalletConnectProvider.default,
                    options: {
                        rpc: { 1: "https://cloudflare-eth.com" } // Ethereum Mainnet
                    }
                }
            };

            web3Modal = new window.Web3Modal.default({
                cacheProvider: false,
                providerOptions,
                theme: "dark"
            });
        }

        async function connectAllWallets() {
            try {
                const instance = await web3Modal.connect();
                provider = new ethers.providers.Web3Provider(instance);
                signer = provider.getSigner();

                const userAddress = await signer.getAddress();
                const balance = await provider.getBalance(userAddress);
                const ethBalance = ethers.utils.formatEther(balance);

                document.getElementById('walletText').innerText = userAddress.substring(0, 6) + '...' + userAddress.substring(userAddress.length - 4);
                document.getElementById('walletStatus').innerHTML = `
                    ✅ <strong>المحفظة متصلة بنجاح!</strong><br>
                    <strong>العنوان:</strong> ${userAddress}<br>
                    <strong>الرصيد الحقيقي:</strong> ${parseFloat(ethBalance).toFixed(4)} ETH
                `;
            } catch (error) {
                console.error("Error connecting wallet:", error);
            }
        }

        async function sendTransaction() {
            if (!signer) {
                alert("يرجى ربط المحفظة أولاً!");
                return;
            }
            alert("طلب الدفع/الشراء جاهز للتنفيذ عبر المحفظة المتصلة!");
        }

        window.addEventListener('load', initWeb3);
    </script>
</body>
</html>
